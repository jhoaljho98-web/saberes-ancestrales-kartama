# Publica la app en GitHub Pages automáticamente cada vez que subes cambios.
# No necesitas hacer nada manual: al hacer "push" a la rama main, GitHub
# construye la app y actualiza el sitio en línea.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite ejecutarlo a mano desde la pestaña "Actions"

# Permisos que necesita el despliegue de Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) Construir la app
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir (genera la carpeta dist)
        run: npm run build

      - name: Subir el resultado para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 2) Desplegar a GitHub Pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
